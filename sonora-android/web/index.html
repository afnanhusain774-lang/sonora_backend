<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="description" content="Sonora — your music, your way.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/styles.css">
  <title>Sonora</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="Sonora home"><span class="brand-icon">♪</span> SONORA</a>
      <nav class="primary-nav" aria-label="Main navigation">
        <button class="nav-link is-active" data-page="home"><span>⌂</span>Home</button>
        <button class="nav-link" data-page="search"><span>⌕</span>Search</button>
        <button class="nav-link" data-page="library"><span>▤</span>Your Library</button>
      </nav>
      <div class="nav-divider"></div>
      <p class="nav-label">YOUR SPACE</p>
      <nav class="secondary-nav" aria-label="Your music">
        <button class="nav-link" data-page="discover"><span>✦</span>Discover Weekly</button>
        <button class="nav-link" data-page="mixes"><span>◉</span>Daily Mixes</button>
        <button class="nav-link" data-page="reels"><span>▣</span>Reels</button>
        <button class="nav-link" data-page="activity"><span>◷</span>Listening activity</button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-link" data-page="settings"><span>⚙</span>Settings</button>
        <button class="connect-button" data-action="spotify-connect"><span class="spotify-dot">●</span><span id="connect-label">Connect Spotify</span></button>
        <p class="sidebar-caption">Spotify provides metadata and licensed playback. Your local audio stays on this device.</p>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="history-buttons" aria-label="Page history">
          <button class="icon-button" data-action="back" aria-label="Go back">‹</button>
          <button class="icon-button" data-action="forward" aria-label="Go forward">›</button>
        </div>
        <a class="mobile-brand" href="#home" aria-label="Sonora home"><span>♪</span>SONORA</a>
        <label class="global-search">
          <span aria-hidden="true">⌕</span>
          <input id="global-query" type="search" placeholder="What do you want to play?" autocomplete="off">
          <kbd>Ctrl K</kbd>
        </label>
        <div class="topbar-actions">
          <button class="icon-button" data-action="device-picker" aria-label="Connected devices" title="Connected devices">▣</button>
          <button class="icon-button mobile-header-button" data-page="activity" aria-label="Listening activity">◷</button>
          <button class="avatar" data-action="profile" aria-label="Profile">S</button>
        </div>
      </header>

      <div class="content-layout">
        <main id="main-content" tabindex="-1"></main>
        <aside class="right-rail" aria-label="Listening activity">
          <div class="rail-heading"><h2>Listening activity</h2><span class="live-dot" aria-label="Live in this browser"></span></div>
          <div id="activity-feed" class="activity-feed"></div>
          <div class="rail-divider"></div>
          <div class="rail-heading"><h2>Your devices</h2><button class="text-button" data-action="device-picker">Manage</button></div>
          <div id="device-list" class="device-list"></div>
          <p class="rail-note">Devices are other Sonora tabs on this browser. Spotify Connect is available after Spotify login.</p>
        </aside>
      </div>

      <nav class="mobile-nav" aria-label="Mobile navigation">
        <button class="nav-link is-active" data-page="home"><span>⌂</span>Home</button>
        <button class="nav-link" data-page="search"><span>⌕</span>Search</button>
        <button class="nav-link" data-page="library"><span>▤</span>Library</button>
        <button class="nav-link" data-page="reels"><span>▣</span>Reels</button>
      </nav>

      <section class="player-bar" aria-label="Music player">
        <div class="player-track">
          <button class="player-track-details" data-action="open-now-playing" aria-label="Open song details">
            <span class="cover cover-violet" id="player-cover">☾</span>
            <span class="player-track-copy"><strong id="player-title">Moonlit Drive</strong><span id="player-artist">Mira Sol · Sonora original</span></span>
          </button>
          <button class="icon-button favorite-button" data-action="favorite" aria-label="Like track">♡</button>
        </div>
        <div class="player-center">
          <div class="player-controls">
            <button class="icon-button control-secondary" data-action="shuffle" aria-label="Shuffle">⤨</button>
            <button class="play-button" data-action="play-pause" aria-label="Play">▶</button>
            <button class="icon-button control-secondary" data-action="lyrics" aria-label="Lyrics">▤</button>
            <button class="icon-button mobile-volume-button" data-action="mobile-volume" aria-label="Adjust volume" aria-expanded="false">◖</button>
          </div>
          <div class="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="duration">0:24</span></div>
        </div>
        <div class="player-tools">
          <button class="icon-button" data-action="quality" aria-label="Audio quality" title="Local file quality">HD</button>
          <button class="icon-button" data-action="pip" aria-label="Open companion player" title="Open companion player">▣</button>
          <span class="volume-icon">◖</span><input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume">
        </div>
      </section>
    </div>
  </div>
  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal"></dialog>
  <input id="audio-import" type="file" accept="audio/*,.flac,.wav,.mp3,.m4a,.ogg,.opus" multiple hidden>
  <input id="lyrics-import" type="file" accept=".lrc,text/plain" hidden>
  <audio id="audio-a" preload="metadata"></audio>
  <audio id="audio-b" preload="metadata"></audio>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
